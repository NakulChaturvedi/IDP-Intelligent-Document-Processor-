# ── PO Processor — Azure Configuration ────────────────────────────────────────

folders:
  po_input:   "C:/po_processor/input"
  templates:  "C:/Users/nakul/Downloads/po-templates"   # subfolders named after companies
  output:     "C:/po_processor/output"

security:
  enabled: true
  usage_log: "C:/Users/nakul/Downloads/po_usage_log.xlsx"
  tokens:
    "364ecb993b7de7e25b2df125263993526da904c461f18a9418b7ea8ab8c72713": "nakul"
    "YOUR_MANAGER_TOKEN_HASH_HERE": "manager"

template:
  sheet_name:        "PO Summary"
  line_items_anchor: "Quantity"
  skip_labels:
    - "PURCHASE ORDER — EXTRACTED DATA"
    - "PURCHASE ORDER - EXTRACTED DATA"
    - "LINE ITEMS"
    - "Field"
    - "Value"
    - "Confidence"
    - "Confidence color guide"
  skip_prefixes:
    - "Confidence color guide"
    - "Green ="
    - "Yellow ="
    - "Red ="

