# ── PO Processor — Azure Configuration ────────────────────────────────────────

folders:
  po_input:   "C:/po_processor/input"
  templates:  "C:/Users/nakul/Downloads/po-templates"   # subfolders named after companies
  output:     "C:/po_processor/output"

security:
  enabled: true
  usage_log: "C:/Users/nakul/Downloads/po_usage_log.xlsx"
  
template:
  sheet_name:        "PO Summary"
  line_items_anchor: "Quantity"
  skip_labels:
    - "PURCHASE ORDER — EXTRACTED DATA"
    - "PURCHASE ORDER - EXTRACTED DATA"
    - "LINE ITEMS"
    - "Field"
    - "Value"
    - "Confidence"
    - "Confidence color guide"
  skip_prefixes:
    - "Confidence color guide"
    - "Green ="
    - "Yellow ="
    - "Red ="

models:
  mistral_azure:
    provider:     mistral_azure
    display_name: "Mistral Document AI (Azure)"
    endpoint:     "https://idp-azure-repo-resource.services.ai.azure.com/providers/mistral/azure/ocr"
    api_key:      "9d3sc9IC1lyeRpm8E508cupcZVIOp169TAQw85cRs5KROMhWSSO7JQQJ99CEACfhMk5XJ3w3AAAAACOGK0hx"
    model_name:   "mistral-document-ai-2512"
    timeout:      300
    retries:      3

  cohere_azure:
    provider:     cohere_azure
    display_name: "Cohere Command A(Azure)"
    endpoint:     "https://idp-azure-repo-resource.services.ai.azure.com/openai/v1/chat/completions"
    api_key:      "9d3sc9IC1lyeRpm8E508cupcZVIOp169TAQw85cRs5KROMhWSSO7JQQJ99CEACfhMk5XJ3w3AAAAACOGK0hx"
    model_name:   "cohere-command-a"
    timeout:      120
    retries:      3

  llama_azure:
    provider:     llama_azure
    display_name: "Llama-4-17B(Azure)"
    endpoint:     "https://idp-azure-repo-resource.services.ai.azure.com/models/chat/completions?api-version=2024-05-01-preview"
    api_key:      "9d3sc9IC1lyeRpm8E508cupcZVIOp169TAQw85cRs5KROMhWSSO7JQQJ99CEACfhMk5XJ3w3AAAAACOGK0hx"
    model_name:   "Llama-4-Scout-17B-16E-Instruct"
    timeout:      120
    retries:      3
  
  gpt4o_azure:
    provider:     openai_azure_responses
    display_name: "GPT-5.4 (Azure)"
    endpoint: "https://idp-azure-repo-resource.services.ai.azure.com/openai/v1/responses"
    api_key: "9d3sc9IC1lyeRpm8E508cupcZVIOp169TAQw85cRs5KROMhWSSO7JQQJ99CEACfhMk5XJ3w3AAAAACOGK0hx"
    model_name: "gpt-5.4-2"
    timeout: 120
    retries: 3